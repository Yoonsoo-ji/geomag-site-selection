<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>세계 자기지도 3D — IGRF-14</title>
<style>
  :root{--ink:#eaf3ff;--pan:rgba(9,17,33,.82);--edge:rgba(120,175,255,.18);--acc:#ffb454}
  html,body{margin:0;height:100%;overflow:hidden;background:#00030a;color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  .card{position:absolute;box-sizing:border-box;background:var(--pan);border:1px solid var(--edge);
    border-radius:16px;backdrop-filter:blur(13px);box-shadow:0 18px 46px rgba(0,0,0,.45);z-index:5}
  #title{left:20px;top:18px;width:min(320px,calc(100vw - 40px));padding:16px 18px}
  #title .bd{display:inline-block;font-size:10px;padding:4px 8px;border-radius:99px;letter-spacing:.4px;
    background:rgba(255,180,84,.14);border:1px solid rgba(255,180,84,.4);color:#ffd7a0;margin-bottom:9px}
  #title h1{font-size:18px;margin:0 0 5px}
  #title p{font-size:12px;color:#93a8c4;line-height:1.5;margin:0}
  #right{right:20px;top:18px;width:min(210px,calc(100vw - 40px));padding:14px 15px}
  #right .rt{font-size:12px;font-weight:700;margin-bottom:8px;color:#cfe0f5}
  .k{display:flex;justify-content:space-between;font-size:12px;margin:6px 0;color:#a6bad2}
  .k b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
  #legend{margin-top:12px;border-top:1px solid var(--edge);padding-top:10px}
  #legwrap{position:relative;height:12px;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.14)}
  #legcanvas{width:100%;height:100%;display:block}
  #legticks{display:flex;justify-content:space-between;font-size:9.5px;color:#8ea4bd;margin-top:3px;font-variant-numeric:tabular-nums}
  #dock{left:50%;bottom:18px;transform:translateX(-50%);padding:9px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
  .seg{display:flex;gap:3px;background:rgba(4,10,22,.6);border-radius:11px;padding:3px}
  .seg button{border:0;background:transparent;color:#a9c0dc;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer}
  .seg button.on{background:linear-gradient(180deg,#2a6bd0,#1c4c9c);color:#fff;box-shadow:0 2px 8px rgba(30,80,170,.5)}
  .tg{border:1px solid var(--edge);background:rgba(20,40,72,.4);color:#cfe0f5;font-size:11.5px;
    padding:7px 11px;border-radius:9px;cursor:pointer}
  .tg.on{background:rgba(79,150,255,.28);border-color:rgba(120,180,255,.6);color:#fff}
  #yr{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#b8cadc;padding:0 4px}
  #yr input{width:120px;accent-color:#ffb454}
  #busy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;color:#dfeeff;
    background:rgba(12,30,60,.8);border:1px solid rgba(120,190,255,.4);padding:10px 18px;border-radius:12px;z-index:8;opacity:0;transition:opacity .25s}
  #hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);font-size:10.5px;color:#7f95ae;z-index:4;white-space:nowrap}
  #mob{display:none}
  @media (max-width:820px){
    #title{left:8px;top:8px;width:calc(100vw - 16px);padding:11px 13px}
    #title h1{font-size:15px}#title p{display:none}
    #right{right:8px;top:auto;bottom:calc(96px + env(safe-area-inset-bottom));width:min(180px,calc(100vw - 16px));padding:10px 12px}
    #right .k{font-size:11px;margin:3px 0}
    #dock{bottom:8px;gap:5px;padding:7px 8px}.seg button{padding:6px 9px;font-size:11px}.tg{padding:6px 8px;font-size:10.5px}
    #yr input{width:84px}#hint{display:none}
    #mob{display:block;position:absolute;right:12px;top:12px;z-index:7;width:30px;height:30px;border-radius:50%;
      border:1px solid var(--edge);background:rgba(6,14,28,.8);color:#cfe0f5;font-size:16px;line-height:26px;padding:0}
    #title.min p,#title.min .bd{display:none}#title.min{width:auto}#title.min h1{font-size:13px;margin:0}
  }
  /* ── LUI 좌측 패널 ── */
  #lui{left:18px;top:18px;bottom:18px;width:360px;max-width:calc(100vw - 36px);padding:0;display:flex;flex-direction:column;overflow:hidden}
  #luihead{padding:14px 16px 10px;border-bottom:1px solid var(--edge)}
  #luihead h1{font-size:16px;margin:4px 0 0}
  #chat{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
  .msg{font-size:12.5px;line-height:1.55;padding:9px 11px;border-radius:11px;max-width:92%;white-space:pre-wrap;word-break:break-word}
  .msg.u{align-self:flex-end;background:linear-gradient(180deg,#2a6bd0,#1c4c9c);color:#fff}
  .msg.a{align-self:flex-start;background:rgba(20,40,72,.55);border:1px solid var(--edge);color:#e7f0fb}
  .msg.a .t{font-size:10px;color:#8ea4bd;margin-top:5px}
  .msg.sys{align-self:center;color:#8ea4bd;font-size:11px;background:none}
  #chips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;border-top:1px solid var(--edge)}
  #chips button{border:1px solid var(--edge);background:rgba(20,40,72,.4);color:#bcd0e8;font-size:11px;padding:5px 9px;border-radius:99px;cursor:pointer}
  #chips button:hover{background:rgba(79,150,255,.28)}
  #inputrow{display:flex;gap:7px;padding:10px 12px 12px;border-top:1px solid var(--edge)}
  #q{flex:1;background:rgba(4,10,22,.7);border:1px solid var(--edge);color:#eaf3ff;border-radius:10px;padding:9px 11px;font-size:12.5px;outline:none}
  #send{border:0;background:linear-gradient(180deg,#2a6bd0,#1c4c9c);color:#fff;border-radius:10px;width:42px;font-size:15px;cursor:pointer}
  #send:disabled{opacity:.5}
  @media (max-width:820px){#lui{left:8px;right:8px;top:8px;bottom:auto;width:auto;height:46vh}}
</style>
</head>
<body>
<div id="app"></div>
<div id="busy">자기장 계산 중…</div>
<button id="mob">−</button>

<div id="lui" class="card">
  <div id="luihead">
    <span class="bd">IGRF‑14 · 로컬 LLM(LM Studio) 질의</span>
    <h1>지자기 지구본 · AI 어시스턴트</h1>
  </div>
  <div id="chat">
    <div class="msg a">안녕하세요. 지자기(편각·복각·총자력)와 선점 후보를 질문해 보세요. 아래 예시를 눌러도 됩니다.
IGRF-14 수치는 서버가 정확히 계산합니다.</div>
  </div>
  <div id="chips">
    <button data-q="2027년 독도 편각과 복각 알려줘">독도 편각</button>
    <button data-q="서울 편각이 2025에서 2030 얼마나 변해?">서울 영년변화</button>
    <button data-q="강원 A등급 후보지 알려줘">강원 A등급</button>
    <button data-q="부적합 후보지는 왜 탈락했어?">부적합 사유</button>
    <button data-q="편각을 왜 측정해야 해?">편각이란?</button>
  </div>
  <div id="inputrow">
    <input id="q" placeholder="질문… 예: 제주 복각은?" autocomplete="off">
    <button id="send">➤</button>
  </div>
</div>

<div id="right" class="card">
  <div class="rt">커서 위치</div>
  <div class="k"><span>위도</span><b id="lat">—</b></div>
  <div class="k"><span>경도</span><b id="lon">—</b></div>
  <div class="k"><span>총자력 F</span><b id="vF">—</b></div>
  <div class="k"><span>편각 D</span><b id="vD">—</b></div>
  <div class="k"><span>복각 I</span><b id="vI">—</b></div>
  <div id="legend">
    <div class="rt" id="legtitle" style="margin-bottom:6px">총자력 F (nT)</div>
    <div id="legwrap"><canvas id="legcanvas" width="220" height="12"></canvas></div>
    <div id="legticks"><span id="t0">—</span><span id="t1">—</span><span id="t2">—</span></div>
  </div>
</div>

<div id="dock" class="card">
  <div class="seg" id="modeSeg">
    <button data-m="F" class="on">총자력 F</button>
    <button data-m="D">편각 D</button>
    <button data-m="I">복각 I</button>
  </div>
  <button class="tg on" id="tgContour">등치선</button>
  <button class="tg on" id="tgLines">자기력선</button>
  <button class="tg on" id="tgSpin">자전</button>
  <button class="tg" id="tgSites" style="border-color:rgba(120,220,150,.5)">선점 후보</button>
  <button class="tg" id="tgExist" style="border-color:rgba(255,210,74,.5);color:#ffe4a0">기존점</button>
  <button class="tg" id="btnKorea">한국으로 ↦</button>
  <button class="tg" id="btnDetail" title="한국 상세 위성지도(선점 검토)">🛰 상세</button>
  <span id="yr">연도 <input id="year" type="range" min="2025" max="2030" step="0.1" value="2026.6"><b id="yearv">2026.6</b></span>
</div>
<div id="hint">드래그 회전 · 휠 확대 · 표면 커서 → 값</div>
<div id="siteinfo" class="card" style="display:none;padding:11px 13px;width:240px;z-index:9;font-size:12px"></div>
<div id="detailwrap" style="display:none;opacity:0;transition:opacity .45s;position:fixed;inset:0;z-index:20;background:#00030a">
  <iframe id="detail" title="한국 상세 위성지도" style="width:100%;height:100%;border:0;display:block"></iframe>
  <button id="detailClose" style="position:absolute;top:12px;left:56px;z-index:21;
    border:1px solid rgba(120,175,255,.45);background:rgba(9,17,33,.92);color:#eaf3ff;font-size:13px;font-weight:600;
    padding:9px 15px;border-radius:11px;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 3px 12px rgba(0,0,0,.5)">◂ 지구본으로</button>
</div>

<script src="igrf14.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const IGRF=window.IGRF, app=document.getElementById('app'), busy=document.getElementById('busy');
const isMobile=matchMedia('(max-width:820px)').matches;
const D2R=Math.PI/180;

// ── scene ──
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x00030a,.012);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.1,isMobile?4.6:5.2);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.4:2));
renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.02;
app.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.06; controls.enablePan=false;
controls.minDistance=isMobile?1.3:1.25; controls.maxDistance=12;
controls.rotateSpeed=isMobile?.55:.85; controls.zoomSpeed=isMobile?.75:1;
scene.add(new THREE.AmbientLight(0xffffff,1.15));
const sun=new THREE.DirectionalLight(0xfff4e0,1.6); sun.position.set(6,3,4); scene.add(sun);

// stars
{const n=isMobile?1100:2400,p=new Float32Array(n*3);
 for(let i=0;i<n;i++){const r=20+Math.random()*30,u=Math.random()*2-1,a=Math.random()*Math.PI*2,s=Math.sqrt(1-u*u);
   p[i*3]=r*s*Math.cos(a);p[i*3+1]=r*u;p[i*3+2]=r*s*Math.sin(a);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.03,color:0x9fc4ff,transparent:true,opacity:.7})));}

const earthGroup=new THREE.Group(); scene.add(earthGroup);
const R=1.0;

// ── magnetic surface (shader samples equirect colormap texture) ──
const NLAT=isMobile?73:121, NLON=isMobile?145:241;      // 2.5°/1.5° grid
const gridF=new Float32Array(NLAT*NLON), gridD=new Float32Array(NLAT*NLON), gridI=new Float32Array(NLAT*NLON);
function latOf(r){return 90 - r*(180/(NLAT-1));}       // row0 = north
function lonOf(c){return -180 + c*(360/(NLON-1));}
function computeGrid(year){
  for(let r=0;r<NLAT;r++){const lat=latOf(r);
    for(let c=0;c<NLON;c++){const e=IGRF.igrfElements(lat,lonOf(c),0,year);
      const k=r*NLON+c; gridF[k]=e.F; gridD[k]=e.D; gridI[k]=e.I;}}
}

// colormaps → [r,g,b]
function ramp(t,st){t=Math.min(1,Math.max(0,t));const n=st.length-1;const x=t*n,i=Math.min(n-1,Math.floor(x)),f=x-i;
  return [st[i][0]+(st[i+1][0]-st[i][0])*f, st[i][1]+(st[i+1][1]-st[i][1])*f, st[i][2]+(st[i+1][2]-st[i][2])*f];}
const CM_F=[[13,27,62],[26,84,160],[20,150,170],[70,190,120],[220,205,80],[240,140,50],[200,40,40]];
const CM_DIV=[[40,90,200],[120,170,235],[240,244,250],[240,150,120],[200,40,40]];
const RANGE={F:[24000,66000],D:[-25,25],I:[-90,90]};
function colorAt(mode,val){
  const [lo,hi]=RANGE[mode]; const t=(val-lo)/(hi-lo);
  return mode==='F'?ramp(t,CM_F):ramp(t,CM_DIV);
}
let MODE='F';
function buildTexture(mode){
  const grid = mode==='F'?gridF:mode==='D'?gridD:gridI;
  const data=new Uint8Array(NLAT*NLON*4);
  for(let k=0;k<NLAT*NLON;k++){const c=colorAt(mode,grid[k]);
    data[k*4]=c[0];data[k*4+1]=c[1];data[k*4+2]=c[2];data[k*4+3]=255;}
  const tex=new THREE.DataTexture(data,NLON,NLAT,THREE.RGBAFormat);
  tex.flipY=false; tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;
  tex.colorSpace=THREE.SRGBColorSpace; tex.needsUpdate=true; return tex;
}
const mapMat=new THREE.ShaderMaterial({
  uniforms:{map:{value:null}},
  vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vP;uniform sampler2D map;
    void main(){float PI=3.141592653589793;vec3 n=normalize(vP);float lat=asin(clamp(n.y,-1.,1.));float lon=atan(-n.z,n.x);
      vec3 col=texture2D(map,vec2((lon+PI)/(2.*PI),(PI*0.5-lat)/PI)).rgb;
      float sh=0.35+0.65*clamp(dot(n,normalize(vec3(6.,3.,4.))),0.,1.);
      gl_FragColor=vec4(col*(0.62+0.5*sh),1.0);}`
});
const earth=new THREE.Mesh(new THREE.SphereGeometry(R,isMobile?96:150,isMobile?64:96),mapMat);
earthGroup.add(earth);

// graticule
const gmat=new THREE.LineBasicMaterial({color:0x0a1420,transparent:true,opacity:.28});
function sph(lat,lon,rr){const p=lat*D2R,L=lon*D2R;return new THREE.Vector3(Math.cos(p)*Math.cos(L),Math.sin(p),-Math.cos(p)*Math.sin(L)).multiplyScalar(rr);}
for(let lat=-60;lat<=60;lat+=30){const pts=[];for(let lon=0;lon<=360;lon+=4)pts.push(sph(lat,lon,1.001));earthGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),gmat));}
for(let lon=0;lon<360;lon+=30){const pts=[];for(let lat=-90;lat<=90;lat+=4)pts.push(sph(lat,lon,1.001));earthGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),gmat));}

// atmosphere
earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.07,64,48),new THREE.ShaderMaterial({
  transparent:true,side:THREE.BackSide,blending:THREE.AdditiveBlending,uniforms:{c:{value:new THREE.Color(0x2f8dff)}},
  vertexShader:`varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vN;uniform vec3 c;void main(){float i=pow(1.-abs(vN.z),3.);gl_FragColor=vec4(c,i*.85);}`})));

// dip poles marker
function mark(lat,lon,color,rr){const m=new THREE.Mesh(new THREE.SphereGeometry(.017,12,12),new THREE.MeshBasicMaterial({color}));m.position.copy(sph(lat,lon,rr||1.0));earthGroup.add(m);return m;}

// ── coastlines + korea (fetched) ──
const coastMat=new THREE.LineBasicMaterial({color:0xe8f2ff,transparent:true,opacity:.5});
const koreaMat=new THREE.LineBasicMaterial({color:0xffb454,transparent:true,opacity:.95});
function addGeo(url,mat,rr,handler){
  fetch(url).then(r=>r.json()).then(d=>{
    (d.features||[]).forEach(f=>{const g=f.geometry;if(!g)return;
      const polys = g.type==='LineString'?[g.coordinates]
        : g.type==='MultiLineString'?g.coordinates
        : g.type==='Polygon'?g.coordinates
        : g.type==='MultiPolygon'?g.coordinates.flat():[];
      polys.forEach(line=>{const pts=line.map(c=>sph(c[1],c[0],rr));
        if(pts.length>1) earthGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat));});
    });
    if(handler)handler(d);
  }).catch(()=>{});
}
addGeo('data/world_coastline.geojson',coastMat,1.002);
addGeo('data/korea_boundary.geojson',koreaMat,1.005);

// ── 3단계: 선점 후보 103(등급 A/B/C) + 기존 측정점 30 마커 ──
const GRADE_COL={A:0x2E8B57,B:0x2E86C1,C:0xE0A400,D:0xCC3333,'미완료':0x9aa7b5};
const candGroup=new THREE.Group(), existGroup=new THREE.Group();
candGroup.visible=false; existGroup.visible=false; earthGroup.add(candGroup); earthGroup.add(existGroup);
const markMeshes=[];
function addSites(url,group,kind){
  fetch(url).then(r=>r.json()).then(d=>{
    d.features.forEach(f=>{
      const c=f.geometry.coordinates, P=sph(c[1],c[0], kind==='cand'?1.006:1.007);
      const geo=kind==='cand'?new THREE.SphereGeometry(0.007,10,10):new THREE.OctahedronGeometry(0.010);
      const col=kind==='cand'?(GRADE_COL[f.properties.grade]||0xffffff):0xffd24a;
      const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:col}));
      m.position.copy(P); m.userData={kind,props:f.properties}; group.add(m); markMeshes.push(m);
    });
  }).catch(e=>console.warn('sites:',e));
}
addSites('data/survey_sites.geojson',candGroup,'cand');
addSites('data/existing_pts.geojson',existGroup,'exist');

// 마커 클릭 → 정보 팝업
const siteinfo=document.getElementById('siteinfo');
function esc(s){return (s==null?'':String(s)).replace(/</g,'&lt;');}
function showSite(u,x,y){
  const p=u.props; let h;
  if(u.kind==='cand'){const gc='#'+(GRADE_COL[p.grade]||0xffffff).toString(16).padStart(6,'0');
    h=`<div style="font-weight:700;margin-bottom:5px"><span style="color:${gc}">●</span> ${esc(p.mid)} · ${esc(p.name)}</div>`
     +`<div style="color:#a6bad2;line-height:1.6">등급 <b style="color:${gc}">${esc(p.grade)}</b> · 판정 ${esc(p.verdict)}<br>`
     +`방위표지 ${esc(p.bang)} · 교란 ${esc(p.disturb)}<br>`
     +`<span style="color:#8ea4bd">${esc(p.hq)} · ${esc(p.surveyor)} · ${esc(p.date)}</span></div>`;
  } else {
    const vf=v=>v==null?'-':(typeof v==='number'?v.toFixed(v>1000?1:3):v);
    h=`<div style="font-weight:700;margin-bottom:5px;color:#ffd24a">⬥ 기존 측정점 · ${esc(p.name)}</div>`
     +`<div style="color:#a6bad2;line-height:1.6">최초설치 ${esc(p.inst_year||'-')} · 최신관측 ${esc(p.obs_year||'-')}<br>`
     +`편각 ${vf(p.decl)}° · 복각 ${vf(p.incl)}° · F ${vf(p.total)} nT<br>`
     +`<span style="color:#8ea4bd;font-size:11px">${esc(p.address)}</span></div>`;
  }
  siteinfo.innerHTML=h; siteinfo.style.display='block';
  const w=siteinfo.offsetWidth, hh=siteinfo.offsetHeight;
  siteinfo.style.left=Math.min(x+12,innerWidth-w-8)+'px';
  siteinfo.style.top=Math.min(y+12,innerHeight-hh-8)+'px';
}
function hideSite(){siteinfo.style.display='none';}
renderer.domElement.addEventListener('click',ev=>{
  const mm=markMeshes.filter(m=>m.parent&&m.parent.visible);
  if(!mm.length){return;}
  mouse.x=ev.clientX/innerWidth*2-1; mouse.y=-(ev.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(mm,false);
  if(hits.length) showSite(hits[0].object.userData, ev.clientX, ev.clientY);
  else hideSite();
});

// ── contour isolines (marching squares on grid) ──
const contourGroup=new THREE.Group(); earthGroup.add(contourGroup);
const LEVELS={F:{step:1000,zero:null,col:0xffffff},D:{step:2,zero:0,col:0xd8ecff},I:{step:10,zero:0,col:0xd8ecff}};
function buildContours(mode){
  contourGroup.clear();
  const grid=mode==='F'?gridF:mode==='D'?gridD:gridI;
  const {step,zero,col}=LEVELS[mode];
  const vals=[]; const [lo,hi]=RANGE[mode];
  const start=Math.ceil(lo/step)*step;
  for(let v=start;v<=hi;v+=step) vals.push(v);
  const segMain=[], segZero=[];
  const interp=(v,a,b)=>(v-a)/(b-a);
  for(let r=0;r<NLAT-1;r++)for(let c=0;c<NLON-1;c++){
    const v00=grid[r*NLON+c],v10=grid[r*NLON+c+1],v01=grid[(r+1)*NLON+c],v11=grid[(r+1)*NLON+c+1];
    const la0=latOf(r),la1=latOf(r+1),lo0=lonOf(c),lo1=lonOf(c+1);
    for(const lev of vals){
      const dst=(zero!==null && lev===zero)?segZero:segMain;
      const pt=[];
      // 4 edges: top(v00-v10),right(v10-v11),bottom(v11-v01),left(v01-v00)
      if((v00-lev)*(v10-lev)<0){const t=interp(lev,v00,v10);pt.push([la0,lo0+(lo1-lo0)*t]);}
      if((v10-lev)*(v11-lev)<0){const t=interp(lev,v10,v11);pt.push([la0+(la1-la0)*t,lo1]);}
      if((v11-lev)*(v01-lev)<0){const t=interp(lev,v11,v01);pt.push([la1,lo1+(lo0-lo1)*t]);}
      if((v01-lev)*(v00-lev)<0){const t=interp(lev,v01,v00);pt.push([la1+(la0-la1)*t,lo0]);}
      for(let i=0;i+1<pt.length;i+=2){dst.push(pt[i],pt[i+1]);}
    }
  }
  const toGeo=(arr,c,op,rr)=>{if(!arr.length)return;const v=[];for(const[la,lo]of arr)v.push(sph(la,lo,rr));
    const g=new THREE.BufferGeometry().setFromPoints(v);
    contourGroup.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:c,transparent:true,opacity:op})));};
  toGeo(segMain,col,.32,1.004);
  toGeo(segZero,0xffe08a,.95,1.006);   // agonic / dip-equator 강조
}

// ── field lines (RK4 in geographic frame → children of earthGroup) ──
const R_KM=6371.2;
function Bvec(P,year){const r=P.length();
  const lat=Math.asin(THREE.MathUtils.clamp(P.y/r,-1,1))/D2R, lon=Math.atan2(-P.z,P.x)/D2R;
  const b=IGRF.igrf(lat,lon,(r-1)*R_KM*1000,year);
  const la=lat*D2R,lo=lon*D2R;
  const north=new THREE.Vector3(-Math.sin(la)*Math.cos(lo),Math.cos(la),Math.sin(la)*Math.sin(lo));
  const east=new THREE.Vector3(-Math.sin(lo),0,-Math.cos(lo));
  const rhat=new THREE.Vector3(Math.cos(la)*Math.cos(lo),Math.sin(la),-Math.cos(la)*Math.sin(lo));
  return north.multiplyScalar(b.X).add(east.multiplyScalar(b.Y)).add(rhat.multiplyScalar(-b.Z));}
function trace(seed,year,dir){let p=seed.clone();const pts=[p.clone()];const ds=.02;
  for(let i=0;i<820;i++){const r=p.length();if(r<1.0015||r>4.6)break;
    const k1=Bvec(p,year).normalize().multiplyScalar(ds*dir);
    const k2=Bvec(p.clone().addScaledVector(k1,.5),year).normalize().multiplyScalar(ds*dir);
    const k3=Bvec(p.clone().addScaledVector(k2,.5),year).normalize().multiplyScalar(ds*dir);
    const k4=Bvec(p.clone().add(k3),year).normalize().multiplyScalar(ds*dir);
    p=p.clone().add(k1.clone().addScaledVector(k2,2).addScaledVector(k3,2).add(k4).multiplyScalar(1/6));pts.push(p.clone());}
  return pts;}
const lineGroup=new THREE.Group(); earthGroup.add(lineGroup);
const partGroup=new THREE.Group(); earthGroup.add(partGroup);
let particles=[];
function buildLines(year){
  lineGroup.clear(); partGroup.clear(); particles=[];
  const n=isMobile?16:24;
  for(let i=0;i<n;i++){const lon=(i/n)*360, lat=-42+((i*71)%86);
    const seed=sph(lat,lon,1.02);
    const pts=trace(seed,year,-1).reverse().concat(trace(seed,year,1).slice(1));
    if(pts.length<16)continue;
    const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal',.5);
    const cp=curve.getPoints(Math.min(360,pts.length*2));
    const geo=new THREE.BufferGeometry().setFromPoints(cp);
    lineGroup.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x9fe6ff,transparent:true,opacity:.42,blending:THREE.AdditiveBlending})));
    for(let j=0;j<3;j++){const sp=new THREE.Mesh(new THREE.SphereGeometry(.014,8,8),
      new THREE.MeshBasicMaterial({color:0xeafcff,transparent:true,opacity:.95,blending:THREE.AdditiveBlending}));
      sp.userData={curve,phase:(j/3+Math.random()*.1)%1,speed:.02+Math.random()*.01};partGroup.add(sp);particles.push(sp);}
  }
}

// ── 한국 중심(카메라 이동용) — 한국 LMM 조밀 패치는 2단계 보류(모델 미완성) ──
const koreaCenter=sph(36.2,127.8,1);

// ── legend ──
const legc=document.getElementById('legcanvas'), lg=legc.getContext('2d');
const legtitle=document.getElementById('legtitle'), tk=[document.getElementById('t0'),document.getElementById('t1'),document.getElementById('t2')];
function drawLegend(mode){
  const [lo,hi]=RANGE[mode];
  for(let x=0;x<legc.width;x++){const t=x/(legc.width-1);const c=colorAt(mode,lo+(hi-lo)*t);
    lg.fillStyle=`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;lg.fillRect(x,0,1,legc.height);}
  const unit=mode==='F'?' nT':'°', fmt=v=>mode==='F'?Math.round(v).toLocaleString():v.toFixed(0);
  legtitle.textContent=mode==='F'?'총자력 F (nT)':mode==='D'?'편각 D (°, 서−/동+)':'복각 I (°, 남−/북+)';
  tk[0].textContent=fmt(lo)+(mode==='F'?'':unit); tk[1].textContent=fmt((lo+hi)/2); tk[2].textContent=fmt(hi)+(mode==='F'?'':unit);
}

// ── build/apply ──
let showContour=true, showLines=true;
function applyMode(){
  mapMat.uniforms.map.value=buildTexture(MODE);
  buildContours(MODE); contourGroup.visible=showContour;
  drawLegend(MODE);
}
function fullRebuild(year){
  busy.style.opacity=1;
  setTimeout(()=>{   // setTimeout 은 탭이 숨겨져도 실행 (rAF 는 멈춤)
    computeGrid(year); applyMode();
    if(showLines) buildLines(year); else {lineGroup.clear();partGroup.clear();particles=[];}
    busy.style.opacity=0;
  },15);
}

// ── UI ──
const yearEl=document.getElementById('year'), yearv=document.getElementById('yearv');
let ytimer; yearEl.oninput=()=>{yearv.textContent=(+yearEl.value).toFixed(1);clearTimeout(ytimer);ytimer=setTimeout(()=>fullRebuild(+yearEl.value),140);};
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  MODE=b.dataset.m; applyMode();
});
const tgC=document.getElementById('tgContour'),tgL=document.getElementById('tgLines'),tgS=document.getElementById('tgSpin');
tgC.onclick=()=>{showContour=!showContour;tgC.classList.toggle('on',showContour);contourGroup.visible=showContour;};
tgL.onclick=()=>{showLines=!showLines;tgL.classList.toggle('on',showLines);
  if(showLines)buildLines(+yearEl.value);else{lineGroup.clear();partGroup.clear();particles=[];}};
let spin=true; tgS.onclick=()=>{spin=!spin;tgS.classList.toggle('on',spin);};
const btnKorea=document.getElementById('btnKorea');
let camGoal=null;
function flyKorea(){camGoal=koreaCenter.clone().applyEuler(earthGroup.rotation).multiplyScalar(1.7);}
btnKorea.onclick=()=>{spin=false;tgS.classList.remove('on');flyKorea();};
const tgSites=document.getElementById('tgSites'), tgExist=document.getElementById('tgExist');
tgSites.onclick=()=>{const on=!candGroup.visible;candGroup.visible=on;tgSites.classList.toggle('on',on);
  if(on){spin=false;tgS.classList.remove('on');if(camera.position.length()>3)flyKorea();}else hideSite();};
tgExist.onclick=()=>{const on=!existGroup.visible;existGroup.visible=on;tgExist.classList.toggle('on',on);
  if(on){spin=false;tgS.classList.remove('on');if(camera.position.length()>3)flyKorea();}else hideSite();};

// ── 한국 상세 위성지도(survey_review.html) 드릴다운 ──
const detailwrap=document.getElementById('detailwrap'), detailFrame=document.getElementById('detail');
let detailOpen=false;
function openDetail(){ if(detailOpen)return; detailOpen=true; hideSite();
  if(!detailFrame.getAttribute('src')) detailFrame.setAttribute('src','survey_review.html');
  detailwrap.style.display='block'; setTimeout(()=>detailwrap.style.opacity=1,20); }
function closeDetail(){ if(!detailOpen)return; detailOpen=false;
  detailwrap.style.opacity=0; setTimeout(()=>detailwrap.style.display='none',460);
  spin=false; tgS.classList.remove('on');
  camGoal=koreaCenter.clone().applyEuler(earthGroup.rotation).multiplyScalar(2.9); }  // 재트리거 방지
document.getElementById('detailClose').onclick=closeDetail;
document.getElementById('btnDetail').onclick=()=>{ if(camera.position.length()>3)flyKorea(); openDetail(); };
const mob=document.getElementById('mob'), lui=document.getElementById('lui');
if(mob) mob.onclick=()=>{lui.style.display=lui.style.display==='none'?'flex':'none';mob.textContent=lui.style.display==='none'?'+':'−';};

// hover
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
const oLat=document.getElementById('lat'),oLon=document.getElementById('lon'),oF=document.getElementById('vF'),oD=document.getElementById('vD'),oI=document.getElementById('vI');
renderer.domElement.addEventListener('pointermove',ev=>{
  mouse.x=ev.clientX/innerWidth*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObject(earth)[0];if(!hit)return;
  const p=earth.worldToLocal(hit.point.clone()).normalize();
  const lat=Math.asin(p.y)/D2R,lon=Math.atan2(-p.z,p.x)/D2R;const e=IGRF.igrfElements(lat,lon,0,+yearEl.value);
  oLat.textContent=lat.toFixed(2)+'°';oLon.textContent=lon.toFixed(2)+'°';
  oF.textContent=Math.round(e.F).toLocaleString()+' nT';oD.textContent=e.D.toFixed(1)+'°';oI.textContent=e.I.toFixed(1)+'°';
});

// ── postfx ──
const comp=new EffectComposer(renderer);
comp.addPass(new RenderPass(scene,camera));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),isMobile?.55:.7,.55,.75));

fullRebuild(+yearEl.value);
let last=performance.now();
function animate(t){requestAnimationFrame(animate);const dt=Math.min(.05,(t-last)/1000);last=t;
  if(spin)earthGroup.rotation.y+=dt*.045;
  if(camGoal){camera.position.lerp(camGoal, 1-Math.pow(0.0025,dt)); controls.target.set(0,0,0);
    if(camera.position.distanceTo(camGoal)<0.02) camGoal=null;}
  for(const p of particles){p.userData.phase=(p.userData.phase+dt*p.userData.speed)%1;p.position.copy(p.userData.curve.getPointAt(p.userData.phase));}
  // 마커는 카메라 거리에 비례해 스케일 → 화면상 일정 크기(확대해도 안 커짐)
  if(markMeshes.length){const ms=camera.position.length()*0.5; for(const m of markMeshes) m.scale.setScalar(ms*(m.userData.hi?1.9:1));}
  // 깊이 확대하면 한국 상세 위성지도(survey_review) 드릴다운
  if(!detailOpen && (candGroup.visible||existGroup.visible) && camera.position.length()<1.48) openDetail();
  controls.update();comp.render();}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);comp.setSize(innerWidth,innerHeight);});

// ── LUI 채팅 (로컬 LLM /api/chat) ──
const chatEl=document.getElementById('chat'), qEl=document.getElementById('q'), sendEl=document.getElementById('send');
function addMsg(text,cls,tier){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;
  if(tier){const t=document.createElement('div');t.className='t';
    t.textContent=tier==='local'?'🟢 로컬 LLM(LM Studio)':tier==='gemini'?'🟣 Gemini':tier==='openai'?'🔵 OpenAI':tier==='data-only'?'🟡 서버 계산(LLM 오프라인)':tier;d.appendChild(t);}
  chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}
function highlightMids(mids){const set=new Set(mids||[]);
  if(set.size){candGroup.visible=true;tgSites.classList.add('on');}
  for(const m of markMeshes){if(m.userData.kind!=='cand')continue;const on=set.has(m.userData.props.mid);
    m.userData.hi=on;m.material.transparent=!on;m.material.opacity=on?1:0.32;}}
function applyActions(actions){(actions||[]).forEach(a=>{
  if(a.type==='focus'){spin=false;tgS.classList.remove('on');
    camGoal=sph(a.lat,a.lon,1).applyEuler(earthGroup.rotation).multiplyScalar(1.7);}
  else if(a.type==='focus_korea'){flyKorea();spin=false;tgS.classList.remove('on');}
  else if(a.type==='highlight'){highlightMids(a.mids);}});}
async function ask(q){q=(q||'').trim();if(!q)return;addMsg(q,'u');qEl.value='';sendEl.disabled=true;
  const wait=addMsg('… 생각 중','a');
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});
    const j=await r.json();wait.remove();addMsg(j.answer||'(응답 없음)','a',j.tier);applyActions(j.actions);}
  catch(e){wait.remove();addMsg('서버 연결 실패 — sv_server.py 를 실행했는지 확인하세요.\n('+e.message+')','a');}
  sendEl.disabled=false;qEl.focus();}
sendEl.onclick=()=>ask(qEl.value);
qEl.addEventListener('keydown',e=>{if(e.key==='Enter')ask(qEl.value);});
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>ask(b.dataset.q));
</script>
